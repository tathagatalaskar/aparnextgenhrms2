server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/apar_db}
    username: ${SPRING_DATASOURCE_USERNAME:apar_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:apar_pass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: tran

app:
  jwt:
    # No production fallback: configure a unique random secret in the backend host.
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    root: WARN
    gov.nic.apar: INFO
